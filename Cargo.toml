[workspace]
members = [".", "corpus", "oracles"]
# oracles' tests need the reference decoders that oracles/build.sh builds; plain cargo commands leave it out, and its
# gate names it (`cargo test -p oracles`).
default-members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
authors = ["BGforge"]
license = "GPL-3.0-only"
publish = false

# Used by more than one member or dependency table.
[workspace.dependencies]
miniz_oxide = "=0.9.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# A module that needs `unsafe` says so with `#![expect(unsafe_code, reason = "...")]`.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# `expect` stays a warning: it is allowed on an invariant that cannot fail, with the message saying why.
unwrap_used = "deny"
expect_used = "warn"
# Each `unsafe` block holds one operation and a `// SAFETY:` comment justifying it.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
# Suppress with `#[expect(lint, reason = "...")]`, which fails once the finding is gone.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# std's print macros panic on a closed pipe (`ipsdoc info *.acm | head -1`); the binary prints through its own.
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future = "deny"
arc_with_non_send_sync = "deny"
large_futures = "warn"
unused_async = "warn"
ptr_arg = "warn"
needless_range_loop = "warn"
# A new variant breaks the match instead of being absorbed by a catch-all.
wildcard_enum_match_arm = "warn"
from_over_into = "warn"
derive_partial_eq_without_eq = "warn"
non_std_lazy_statics = "warn"
# An ignored test says why, so a skip is tracked.
ignore_without_reason = "warn"

[package]
name = "ipsdoc"
version = "0.2.0"
description = "Reads, writes and repairs Interplay ACM, WAVC and other game sound files"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# symphonia-format-riff 0.6.1 multiplies a WAV's channel count by its sample width unchecked, only to log a block
# align mismatch: release builds wrap there and read on, dev and test builds panic on a damaged header. Match release.
[profile.dev.package.symphonia-format-riff]
overflow-checks = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
# Message files of the translations other than cp1252 (cp1250, cp1251, cp1258).
encoding_rs = "=0.8.42"
# Pronunciation for languages other than English, its data downloaded per language (`g2p::espeak`).
espeak-ng = { version = "=0.2.0", default-features = false }
hound = "=3.5.1"
miniz_oxide.workspace = true
realfft = "=3.5.0"
# SHA-256 of a downloaded pronouncing dictionary; already in the build as rustls's cryptography.
ring = "=0.17.14"
rubato = "=5.0.1"
symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "adpcm", "ogg", "vorbis", "flac", "mp3", "aac", "isomp4", "alac"] }
thiserror = "=2.0.21"
# Composes decoded text (NFC): cp1258 writes Vietnamese tones as combining marks, which eSpeak's port reads as word
# breaks.
unicode-normalization = "=0.1.26"
# Downloads pronouncing dictionaries other than the built-in English one: rustls with ring and the bundled root
# certificates, so no system TLS library is needed on any target. minreq would be smaller but turns on rustls's
# default aws-lc backend, a cmake-built C library.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
vorbis_rs = "=0.5.6"

[build-dependencies]
# Compresses the pronouncing dictionary (build.rs); the library inflates it with the same crate.
miniz_oxide.workspace = true
