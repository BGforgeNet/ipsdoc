# Third-party notices for the shipped binary (`cargo about generate`, run by the release job). Dev and build
# dependencies never ship; neither do crates for other targets.
# The same list as `allow` in deny.toml, which the gate checks: change both together.
accepted = ["GPL-3.0-only", "GPL-3.0-or-later", "MIT", "Apache-2.0", "BSD-3-Clause", "MPL-2.0", "Unicode-3.0"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu", "aarch64-apple-darwin"]

# The crate ships no licence file; its repository's, at the published commit, carries the copyright line.
[vorbis_rs.clarify]
license = "BSD-3-Clause"

[[vorbis_rs.clarify.git]]
path = "LICENSE"
license = "BSD-3-Clause"
checksum = "86c9ae504639a2a0e68f46f244a95daa9011b955aa0d02cf70f09c06d10e26e4"

# The crates' MIT file is indented, which keeps it from being recognised.
[windows-sys.clarify]
license = "MIT OR Apache-2.0"

[[windows-sys.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

