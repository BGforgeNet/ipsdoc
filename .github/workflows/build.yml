name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel tag (release) runs; superseded branch runs are cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

# The toolchain comes from rust-toolchain.toml, which rustup on every runner honours.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # persist-credentials: false - nothing here pushes, and the token would stay in .git/config for later steps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            fuzz
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,zizmor@1.30.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The fuzz targets are a workspace of their own, run by cargo-fuzz on nightly; here they are kept compiling.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny --workspace check
      - run: cargo machete
      - run: shellcheck oracles/*.sh tests/*.sh .github/scripts/*.sh
      - run: .github/scripts/build-oxfmt.sh
      # install-action has no actionlint; the Go module proxy serves this tag checksummed.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: zizmor --offline .github/workflows

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # GNU, not MSVC: the Vorbis encoder's bundled C build is tested upstream only there.
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --workspace --exclude oracles --all-features --locked --target ${{ matrix.target }}

  # Builds the reference decoders from their pinned upstream sources and checks them against each other.
  oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: echo "IPSDOC_ORACLES=$RUNNER_TEMP/oracles" >> "$GITHUB_ENV"
      - run: oracles/build.sh "$IPSDOC_ORACLES"
      - run: cargo test -p oracles --locked

  # Interplay's snd2acm.exe, which the Python tool wrapped, encodes the cross-tool fixtures.
  snd2acm:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Full history: the executable is read from the Python tool's last commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: snd2acm
      - run: rustup target add x86_64-pc-windows-gnu
      - run: oracles/snd2acm.sh "$RUNNER_TEMP/tools"
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snd2acm
          path: ${{ runner.temp }}/tools/snd2acm
          if-no-files-found: error

  # Other encoders' output decodes in ours as in the engines; AcmTools' decoder reads our lossless files.
  cross-tools:
    needs: snd2acm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: FalloutBoy2099/AcmTools
          ref: 98ce40c0d6168ee052c6deca325eded0615375b4
          path: acmtools-src
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: |
          echo "IPSDOC_ORACLES=$RUNNER_TEMP/oracles" >> "$GITHUB_ENV"
          echo "IPSDOC_TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
      - run: oracles/build.sh "$IPSDOC_ORACLES"
      - run: dotnet build acmtools-src/AcmTools.Cli -c Release
      - run: oracles/cross-tools.sh "$IPSDOC_TOOLS" dotnet run --no-build -c Release --project acmtools-src/AcmTools.Cli --
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snd2acm
          path: ${{ runner.temp }}/tools/snd2acm
      - run: cargo test -p oracles --locked --test tools -- --ignored --nocapture
        env:
          IPSDOC_TOOLS_REQUIRE: snd2acm,acmtools,acmtools-decoded

  # Every binary is cross-built on Linux with zig as the C compiler and linker: Linux and Windows builds are static
  # (Windows ones load only system DLLs, the Universal C Runtime among them), and macOS's are universal, linking only
  # the system library, as every macOS program does. The smoke job runs each on its own platform.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            rust-targets: x86_64-unknown-linux-musl
            exe: ipsdoc
          - target: aarch64-unknown-linux-musl
            rust-targets: aarch64-unknown-linux-musl
            exe: ipsdoc
          - target: x86_64-pc-windows-gnu
            rust-targets: x86_64-pc-windows-gnu
            exe: ipsdoc.exe
          - target: i686-pc-windows-gnu
            rust-targets: i686-pc-windows-gnu
            exe: ipsdoc.exe
          # Not a rustup target: cargo-zigbuild builds the two it names and merges them.
          - target: universal2-apple-darwin
            rust-targets: x86_64-apple-darwin aarch64-apple-darwin
            exe: ipsdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tag's binaries are what the release publishes: built from scratch, not over a cache any branch run wrote.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-key: ${{ matrix.target }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2,cargo-zigbuild@0.23.4
      - run: rustup target add ${{ matrix.rust-targets }}
      - run: cargo zigbuild -p ipsdoc --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" LICENSE dist/
          cp data/cmudict/LICENSE dist/CMUDICT-LICENSE.txt
          cargo about generate --locked about.hbs -o dist/THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipsdoc-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # The shipped binaries, run where they are meant to run: nothing on the build runner can run most of them. Real
  # Windows rather than wine, whose own C runtime says nothing about loading the Universal C Runtime; the 32-bit build
  # runs under WoW64. One macOS runner per architecture, so each slice of the universal binary runs.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: ipsdoc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            exe: ipsdoc
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            exe: ipsdoc.exe
          - os: windows-latest
            target: i686-pc-windows-gnu
            exe: ipsdoc.exe
          - os: macos-26
            target: universal2-apple-darwin
            exe: ipsdoc
          - os: macos-26-intel
            target: universal2-apple-darwin
            exe: ipsdoc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipsdoc-${{ matrix.target }}
          path: ${{ runner.temp }}/dist
      # Artifacts do not keep the executable bit.
      - run: chmod +x "$RUNNER_TEMP/dist/${{ matrix.exe }}" && tests/smoke.sh "$RUNNER_TEMP/dist/${{ matrix.exe }}"

  # Read-only everywhere else; only publishing a tag's release writes.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, oracles, cross-tools, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ipsdoc-*
          path: dist
      # Artifacts do not keep the executable bit, and zip stores the mode each file has.
      - run: chmod +x dist/ipsdoc-*/ipsdoc
      - run: |
          cd dist
          for d in ipsdoc-*; do (cd "$d" && zip -q -r "../$d.zip" .); done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes ./*.zip
        env:
          GH_TOKEN: ${{ github.token }}
